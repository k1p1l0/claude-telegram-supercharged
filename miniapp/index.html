  // Every control request: tma auth and the selected machine, JSON for POST.
  async function api(path, o) {
    o = o || {};
    const q = new URLSearchParams(o.q || {});
    q.set('machine', S.machine);
    const ctrl = new AbortController();
    let timedOut = false;
    const killer = setTimeout(() => { timedOut = true; ctrl.abort(); }, o.timeout || 30000);
    const outer = o.signal, onAbort = () => ctrl.abort();
    if (outer) outer.addEventListener('abort', onAbort);
    const headers = { Authorization: 'tma ' + ((WA && WA.initData) || '') };
    if (o.body) headers['Content-Type'] = 'application/json';
    try {
      const res = await fetch(path + '?' + q, {
        method: o.body ? 'POST' : 'GET', headers, body: o.body ? JSON.stringify(o.body) : undefined,
        cache: 'no-store', credentials: 'same-origin', signal: ctrl.signal,
      });
      const data = await res.json().catch(() => null);
      if (res.ok && data && data.ok !== false && !data.error) return { ok: true, status: res.status, data };
      return { ok: false, status: res.status, error: data && typeof data.error === 'string' ? data.error : '' };
    } catch (_) {
      return { ok: false, status: 0, timedOut, aborted: !timedOut };
    } finally {
      clearTimeout(killer);
      if (outer) outer.removeEventListener('abort', onAbort);
    }
  }
  function errText(r) {
    const why = sentence(r.error), tail = why ? ' ' + why : '';
    switch (r.status) {
      case 0: return r.timedOut ? 'No answer in time. It may still finish, so check again in a moment.' : 'Could not reach the bot. Check your connection and try again.';
      case 400: return 'The bot rejected this request.' + tail;
      case 401: return 'Your sign-in expired. Close the board and open it again with /agents.';
      case 403: return 'Not allowed. Your account can view this board but not control sessions.';
      case 404: return 'Not found. The session may have ended.';
      case 409: return 'Not possible for this session.' + tail;
      case 429: return 'Too many actions. Wait a minute, then try again.';
      case 502: return S.machine === 'local' ? 'The command failed.' + tail : `${machineName()} is offline. Try again when it is back.`;
      default: return `Something went wrong (HTTP ${r.status}).` + tail;
    }
  }

          <p class="fld-hint mono" id="nt-cwd">${esc(C.newCwd)}</p>
        </div>
        <div class="fld">
          <label class="fld-l" for="nt-prompt">Prompt</label>
          <textarea id="nt-prompt" rows="4" maxlength="${MAX_TEXT}" placeholder="What should Claude do?" aria-describedby="nt-prompt-err"></textarea>
          <p class="fld-err" id="nt-prompt-err"></p>
        </div>
        <fieldset class="fld">
          <legend class="fld-l">Permission mode</legend>
          <div class="modes">${MODES.map(m => `<label class="mode"><input type="radio" name="nt-mode" value="${m.v}"${m.v === C.newMode ? ' checked' : ''} aria-describedby="nt-mode-hint"><span>${m.label}</span></label>`).join('')}</div>
          <p class="fld-hint" id="nt-mode-hint" aria-live="polite">${modeHint(C.newMode)}</p>
        </fieldset>
        <button type="submit" class="btn-primary" id="nt-go">Start task</button>
        <p class="res" id="nt-res" role="status"></p>
      </form>`;
    $('#nt-prompt').value = C.newDraft;
  }
  function syncNewBtn() {
    const b = $('#nt-go'); if (!b) return;
    b.setAttribute('aria-disabled', String(C.newBusy));
    b.classList.toggle('busy', C.newBusy);
    setHTML(b, C.newBusy ? '<span class="spin" aria-hidden="true"></span>Starting…' : 'Start task');
    const ta = $('#nt-prompt'); if (ta) ta.readOnly = C.newBusy;
  }
  function showRes(el, ok, text) {
    if (!el) return;
    el.className = 'res';
    el.textContent = '';
    el._h = null;
    // Cleared first, so the live region also announces a repeat of the same text.
    setTimeout(() => { if (!el.isConnected) return; el.className = 'res on ' + (ok ? 'ok' : 'err'); setHTML(el, `${svg(ok ? 'check' : 'alert')}<span>${esc(text)}</span>`); }, 60);
  }
  async function submitNew() {
    if (C.newBusy) return;
    const sel = $('#nt-proj'), ta = $('#nt-prompt'), err = $('#nt-prompt-err');
    if (!sel || !ta) return;
    const cwd = sel.value, prompt = ta.value.trim();
    const checked = $('input[name="nt-mode"]:checked');
    const mode = checked ? checked.value : 'plan';
    if (!prompt) {
      setText(err, 'Write what Claude should do.');
      ta.setAttribute('aria-invalid', 'true');
      ta.focus();
      return;
    }
    const proj = projects().find(p => p.cwd === cwd);
    const mLabel = (MODES.find(m => m.v === mode) || MODES[0]).label;
    if (!await confirmAction(`Start a background task in ${clipName(proj ? proj.name : cwd)} (${mLabel})?`, 'Start')) return;
    if (!C.sheet || C.sheet.kind !== 'new' || C.newBusy) return;
    C.newBusy = true; syncNewBtn();
    const gen = S.gen;
    const r = await api('api/control', { body: { action: 'new', cwd, prompt, mode } });
    C.newBusy = false;
    if (gen !== S.gen) return;
    notify(r.ok ? 'success' : 'error');
    const msg = r.ok ? (r.data.message || 'Task started.') : errText(r);
    if (r.ok) {
      C.newDraft = ''; C.newCwd = cwd; C.newMode = mode;
      try { localStorage.setItem('ccab.cwd.' + S.machine, cwd); } catch (_) {}
      kick();
    }
    if (!C.sheet || C.sheet.kind !== 'new') { announce(msg); return; }
    if (r.ok) {
      $('#sheet-body').innerHTML = `<div class="done">
          <div class="done-ico">${svg('check')}</div>
          <h3 id="nt-done" tabindex="-1">Task started</h3>
          <p>${esc(msg)}</p>
          <div class="done-acts"><button type="button" class="btn-soft" data-nt-again>Start another</button><button type="button" class="btn-primary" data-sheet-close>Done</button></div>
        </div>`;
      $('#nt-done').focus({ preventScroll: true });
      announce(msg);
    } else {
      syncNewBtn();
      showRes($('#nt-res'), false, msg);
    }
  }

  /* ---------- Logs ---------- */
  function openLogs(s, trigger) {
    C.logs = { id: String(s.id), name: s.name || 'Session', output: null, err: null, busy: false };
    openSheet('logs', 'Logs', `<button type="button" class="icon-btn" data-logs-refresh aria-label="Refresh logs">${svg('refresh')}</button>`, trigger);
    $('#sheet-body').innerHTML = `<p class="sh-sub">Recent terminal output of <b>${esc(C.logs.name)}</b>.</p><div id="logs-box"></div>`;
    $('#sheet-title').focus({ preventScroll: true });
    loadLogs();
  }
  async function loadLogs() {
    const L = C.logs;
    if (!L || L.busy) return;
    L.busy = true; renderLogs(false);
    const gen = S.gen;
    const r = await api('api/control', { body: { action: 'logs', id: L.id } });
    L.busy = false;
    if (C.logs !== L || gen !== S.gen) return;
    if (r.ok) { L.output = typeof r.data.output === 'string' ? r.data.output : ''; L.err = null; }
    else { L.err = errText(r); notify('error'); }
    renderLogs(r.ok);
    announce(r.ok ? 'Logs loaded' : L.err);
  }
  function renderLogs(scroll) {
    const L = C.logs, box = $('#logs-box');
    if (!L || !box) return;
    const rb = $('[data-logs-refresh]');
    if (rb) rb.setAttribute('aria-disabled', String(L.busy));
    let html = '';
    if (L.output != null) html = `<pre class="logs" tabindex="0" aria-label="Log output">${esc(L.output.replace(/\s+$/, '') || 'No output yet.')}</pre>`;
    else if (L.busy) html = `<div class="logs logs-wait"><span class="spin" aria-hidden="true"></span><span class="sr-only">Loading logs</span></div>`;
    if (L.err) html += `<p class="res on err">${svg('alert')}<span>${esc(L.err)}</span></p>`;
    setHTML(box, html);
    if (scroll) { const b = $('#sheet-body'); b.scrollTop = b.scrollHeight; }
  }

  /* ---------- Detail: messages, composer, control rows ---------- */
  function controlsShell() {
    const row = k => {
      const a = ACTS[k];
      return `<button type="button" class="ctl" data-act="${k}" aria-label="${a.name}" aria-describedby="ctl-d-${k}"${k === 'logs' ? ' aria-haspopup="dialog"' : ''} hidden>
        <span class="ctl-ico">${svg(a.icon)}</span>
        <span class="ctl-txt"><span class="ctl-name">${a.name}</span><span class="ctl-desc" id="ctl-d-${k}">${a.desc}</span></span>
        <span class="ctl-end">${k === 'logs' ? svg('chevR') : ''}<span class="spin" aria-hidden="true"></span></span>
      </button>`;
    };
    return `<section class="block" id="d-msg" aria-labelledby="d-msg-title" hidden>
        <div class="block-head"><h2 id="d-msg-title">Messages</h2><span class="count" id="d-msg-count"></span></div>
        <div class="card msgs">
          <div class="msg-body" id="d-msg-body"></div>
          <form class="composer" id="d-send" hidden>
            <label class="sr-only" for="d-send-text">Message to this session</label>
            <textarea id="d-send-text" rows="1" maxlength="${MAX_TEXT}" placeholder="Message this session" aria-describedby="d-send-hint" autocomplete="off"></textarea>
            <button type="submit" class="send" id="d-send-go" aria-disabled="true">Send</button>
          </form>
        </div>
        <p class="cmp-foot" id="d-send-foot" hidden><span id="d-send-hint">Continues the session in the background. If it is still running, a copy starts.</span><span class="cmp-count" id="d-send-count"></span></p>
        <p class="res" id="d-send-res" role="status"></p>
      </section>
      <section class="block" id="d-ctl" aria-labelledby="d-ctl-title" hidden>
        <div class="block-head"><h2 id="d-ctl-title">Controls</h2></div>
        <div class="card ctl-list" id="d-ctl-safe">${['logs', 'stop', 'bot-new', 'bot-restart'].map(row).join('')}</div>
        <div class="card ctl-list danger" id="d-ctl-danger" role="group" aria-label="Process signals and removal">${['rm', 'interrupt', 'terminate'].map(row).join('')}</div>
      </section>
      <p class="res" id="d-ctl-res" role="status"></p>`;
  }
  function renderControls(s, ended) {
    const sec = $('#d-msg');
    if (!sec) return;
    const id = S.detailId;
    const acts = ended ? [] : actionsOf(s);
    const m = C.msgs && C.msgs.id === id ? C.msgs : null;
    const peek = acts.includes('peek');
    // An ended session keeps the messages already loaded, read-only.
    sec.hidden = !(peek || (controlOn() && m && m.list));
    const form = $('#d-send'), canSend = acts.includes('send');
    const appear = form.hidden && canSend;
    form.hidden = !canSend;
    $('#d-send-foot').hidden = !canSend;
    if (appear) grow($('#d-send-text'));
    syncSend();
    if (peek && m) maybeLoadMessages(s, m);
    if (!sec.hidden) renderMessages();

    const busy = C.busy && C.busy.id === id ? C.busy.act : null;
    let safe = 0, danger = 0;
    $$('#d-ctl .ctl').forEach(b => {
      const k = b.dataset.act, on = acts.includes(k);
      b.hidden = !on;
      if (on) { if (ACTS[k].danger) danger++; else safe++; }
      b.classList.toggle('busy', busy === k);
      b.setAttribute('aria-disabled', String(!!busy));
    });
    $('#d-ctl-safe').hidden = !safe;
    $('#d-ctl-danger').hidden = !danger;
    $('#d-ctl').hidden = !(safe + danger);
  }

  function grow(ta) {
    if (!ta || !ta.getClientRects().length) return;
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight + 2, 148) + 'px';
  }
  function syncSend() {
    const ta = $('#d-send-text'), b = $('#d-send-go');
    if (!ta || !b) return;
    const sending = C.sending === S.detailId;
    const len = ta.value.length;
    b.setAttribute('aria-disabled', String(sending || !ta.value.trim() || len > MAX_TEXT));
    b.classList.toggle('busy', sending);
    setHTML(b, sending ? '<span class="spin" aria-hidden="true"></span><span class="sr-only">Sending</span>' : 'Send');
    ta.readOnly = sending;
    const cnt = $('#d-send-count');
    setText(cnt, len > MAX_TEXT - 1000 ? `${fmtInt(len)} / ${fmtInt(MAX_TEXT)}` : '');
    cnt.classList.toggle('over', len >= MAX_TEXT);
  }

  // Refetch when the session moved (new activity), or every 20 s, never two at once.
  const peekSig = s => [s.lastActivity, s.status, s.toolCalls].join('|');
  function maybeLoadMessages(s, m) {
    if (m.inflight) return;
    const sig = peekSig(s);
    if (!m.at || (S.mode === 'live' && (sig !== m.sig || performance.now() - m.at > PEEK_STALE_MS))) loadMessages(m, sig);
  }
  async function loadMessages(m, sig) {
    if (m.inflight) return;
    const ctrl = new AbortController();
    m.inflight = ctrl;
    if (sig != null) m.sig = sig;
    const gen = S.gen;
    const r = await api('api/session/messages', { q: { id: m.id, limit: PEEK_LIMIT }, timeout: 12000, signal: ctrl.signal });
    if (m.inflight === ctrl) m.inflight = null;
    if (r.aborted || C.msgs !== m || gen !== S.gen) return;
    m.at = performance.now();
    if (r.ok && Array.isArray(r.data.messages)) {
      m.list = r.data.messages.filter(x => x && typeof x.text === 'string');
      m.err = null;
    } else if (!m.list) {
      // A failed refresh keeps the messages already shown; only a failed first load shows the error.
      m.err = !r.ok ? (r.status === 403 ? 'Not allowed to read this session.' : errText(r)) : 'The bot sent an answer this board does not understand.';
    }
    if (S.view === 'detail' && S.detailId === m.id) renderMessages();
  }
  const TOOL_LINE = /^\[([A-Za-z][\w.:-]{0,80})\]\s?(.*)$/;
  function renderMessages() {
    const box = $('#d-msg-body'), count = $('#d-msg-count');
    const m = C.msgs && C.msgs.id === S.detailId ? C.msgs : null;
    if (!box) return;
    if (!m || (!m.list && !m.err)) {
      setText(count, '');
      box.setAttribute('aria-busy', 'true');
      setHTML(box, `<div class="msg-sk" aria-hidden="true">${skLine('62%', 36, 'border-radius:16px')}${skLine('46%', 36, 'border-radius:16px;align-self:flex-end')}${skLine('78%', 54, 'border-radius:16px')}</div><span class="sr-only">Loading messages</span>`);
      return;
    }
    box.setAttribute('aria-busy', 'false');
    if (!m.list) {
      setText(count, '');
      setHTML(box, `<div class="msg-note err">${svg('alert')}<span>${esc(m.err)}</span><button type="button" class="btn-link" data-msg-retry>Try again</button></div>`);
      return;
    }
    if (!m.list.length) {
      setText(count, '');
      setHTML(box, `<p class="msg-note">No messages yet.</p>`);
      return;
    }
    // Consecutive tool lines ("[Bash] git status") fold into one muted block.
    const items = [];
    m.list.forEach(x => {
      const role = x.role === 'user' ? 'u' : 'a';
      const tl = role === 'a' && x.text.indexOf('\n') < 0 ? TOOL_LINE.exec(x.text.trim()) : null;
      if (tl) {
        const last = items[items.length - 1];
        if (last && last.tools) last.tools.push(tl); else items.push({ tools: [tl] });
      } else {
        // The daemon's own turns arrive wrapped in <channel ...>…</channel>; show just the message.
        const text = role === 'u' ? x.text.replace(/^\s*<channel\b[^>]*>([\s\S]*?)<\/channel>\s*$/, '$1') : x.text;
        items.push({ role, text, ts: tsMs(x.ts) });
      }
    });
    const skip = m.all ? 0 : Math.max(0, items.length - PEEK_SHOWN);
    const now = serverNow();
    setText(count, `last ${fmtInt(m.list.length)}`);
    const li = it => {
      if (it.tools) {
        return `<li class="tools"><span class="sr-only">Tool calls:</span>${it.tools.map(t => `<span class="tl"><b>${esc(prettyTool(t[1]))}</b><span>${esc(t[2])}</span></span>`).join('')}</li>`;
      }
      // Keyed by content, so an expanded message stays expanded when the list refreshes.
      const key = `${it.role}${it.text.length}:${it.text.slice(0, 60)}`;
      const long = it.text.length > 700 || (it.text.match(/\n/g) || []).length > 9;
      const open = m.open.has(key);
      const who = it.role === 'u' ? 'User' : 'Claude';
      const meta = (it.ts ? `<span>${esc(clockTime(it.ts, now))}</span>` : '') +
        (long ? `<button type="button" class="msg-x" data-msg-more="${esc(key)}" aria-expanded="${open}">${open ? 'Show less' : 'Show more'}</button>` : '');
      return `<li class="msg ${it.role}"><span class="sr-only">${who}:</span><div class="bub${long && !open ? ' clamp' : ''}">${esc(it.text.replace(/^\s+|\s+$/g, ''))}</div>${meta ? `<span class="msg-meta">${meta}</span>` : ''}</li>`;
    };
    setHTML(box, (skip ? `<button type="button" class="msg-all" data-msg-all>Show ${plural(skip, 'earlier item', 'earlier items')}</button>` : '') +
      `<ol class="msg-list" id="d-msg-list" tabindex="-1" aria-label="Recent messages, oldest first">${items.slice(skip).map(li).join('')}</ol>`);
  }

  async function submitSend() {
    const id = S.detailId, ta = $('#d-send-text');
    if (!ta || C.sending === id) return;
    const s = liveSession(id), text = ta.value.trim();
    if (!s || !actionsOf(s).includes('send')) return;
    if (!text) { ta.focus(); return; }
    if (!await confirmAction(`Send this message to "${clipName(s.name)}"?`, 'Send')) return;
    if (C.sending === id) return;
    C.sending = id; syncSend();
    const gen = S.gen;
    const r = await api('api/control', { body: { action: 'send', id, text } });
    if (C.sending === id) C.sending = null;
    if (gen !== S.gen) return;
    notify(r.ok ? 'success' : 'error');
    const msg = r.ok ? (r.data.message || 'Sent.') : errText(r);
    if (r.ok) C.drafts.delete(id);
    if (S.view !== 'detail' || S.detailId !== id) { announce(msg); return; }
    const cur = $('#d-send-text');
    if (r.ok && cur && cur.value.trim() === text) { cur.value = ''; grow(cur); }
    syncSend();
    showRes($('#d-send-res'), r.ok, msg);
    if (r.ok) { if (C.msgs && C.msgs.id === id) C.msgs.at = 0; kick(); }
  }
  async function runAction(k, trigger) {
    const id = S.detailId, s = liveSession(id), def = ACTS[k];
    if (!s || !def || !actionsOf(s).includes(k) || (C.busy && C.busy.id === id)) return;
    if (k === 'logs') { openLogs(s, trigger); return; }
    if (!await confirmAction(def.ask(clipName(s.name)), def.name, !!def.danger)) return;
    if (C.busy && C.busy.id === id) return;
    C.busy = { id, act: k };
    if (S.view === 'detail') renderDetail();
    const gen = S.gen;
    const r = await api('api/control', { body: { action: k, id } });
    if (C.busy && C.busy.id === id) C.busy = null;
    if (gen !== S.gen) return;
    notify(r.ok ? 'success' : 'error');
    const msg = r.ok ? (r.data.message || 'Done.') : errText(r);
    if (S.view !== 'detail' || S.detailId !== id) { announce(msg); return; }
    renderDetail();
    showRes($('#d-ctl-res'), r.ok, msg);
    if (r.ok) kick();
  }

  /* ================= Clock (1 s) ================= */
  function tick() {
    const now = serverNow();
    $$('[data-ago]').forEach(el => setText(el, fmtAgo(now - n0(+el.dataset.ago), el.dataset.f || 'short')));
    $$('[data-up]').forEach(el => setText(el, uptime(now - n0(+el.dataset.up))));
    const age = S.snap ? performance.now() - S.at : 0;
    let upd = 'connecting…';
    if (S.mode === 'loading') upd = 'starting up…';
    else if (S.snap) upd = 'updated ' + fmtAgo(age, 'ago');
    else if (S.mode === 'unreachable') upd = S.err === 'machine' ? 'not reachable' : 'no connection';
    setText($('#updated'), upd);
    const toast = $('#toast');
    if (S.mode === 'stale') {
      const who = S.err === 'machine' ? machineName() : 'Mac';
      const html = `${svg('wifiOff')}<span>${esc(who)} unreachable · data from ${esc(fmtAgo(age, 'ago'))}</span>`;
      setHTML(toast, html);
      toast.hidden = false;
    } else if (!toast.hidden) {
      toast.hidden = true; toast._h = null;
    }
  }

  /* ================= Networking ================= */
  let timer = 0, inflight = null, pausedAbort = false;
  function schedule(ms) {
    clearTimeout(timer);
    if (!doc.hidden && !S.paused) timer = setTimeout(poll, ms);
  }
  function remember(snap) {
    const seen = new Set();
    (snap.sessions || []).forEach(s => { S.known.set(String(s.id), s); seen.add(String(s.id)); });
    for (const k of S.known.keys()) if (!seen.has(k) && k !== S.detailId) S.known.delete(k);
  }
  function onSnapshot(data) {
    const wasDown = S.mode === 'stale' || S.mode === 'unreachable';
    S.snap = data;
    S.at = performance.now();
    S.fails = 0;
    S.err = null;
    S.mode = 'live';
    remember(data);
    render();
    if (wasDown) announce('Back online');
  }
  function onError() {
    S.fails++;
    S.err = 'net';
    const prev = S.mode;
    if (S.snap) S.mode = 'stale';
    else if (S.fails >= 2 || prev === 'unreachable') S.mode = 'unreachable';
    render();
    if (prev === 'live' && S.mode === 'stale') announce('Mac unreachable. Showing the last data.');
  }
  // The bot answered, but the selected machine didn't. The backend has already
  // waited for it, so go straight to the offline state.
  function onMachineDown() {
    S.fails++;
    S.err = 'machine';
    const prev = S.mode;
    S.mode = S.snap ? 'stale' : 'unreachable';
    render();
    if (prev !== S.mode) announce(`${machineName()} is not reachable${S.snap ? '. Showing the last data.' : ''}`);
  }
  async function poll() {
    clearTimeout(timer);
    if (doc.hidden || S.paused || inflight) return;
    const ctrl = new AbortController();
    const gen = S.gen, mid = S.machine;
    inflight = ctrl; pausedAbort = false;
    const killer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    let next = POLL_MS;
    try {
      const res = await fetch(mid === 'local' ? 'api/state' : 'api/state?machine=' + encodeURIComponent(mid), {
        headers: { Authorization: 'tma ' + ((WA && WA.initData) || '') },
        cache: 'no-store', credentials: 'same-origin', signal: ctrl.signal,
      });
      if (gen !== S.gen) return; // the user switched machines while this was in flight
      if (res.status === 401 || res.status === 403) {
        S.mode = 'auth'; S.snap = null;
        if (S.view === 'detail') goBack(true);
        render();
        next = 0; // stop; retried when the app becomes visible again
      } else if (!res.ok) {
        const body = await res.json().catch(() => null);
        if (gen !== S.gen) return;
        takeMachines(body);
        const err = body && body.error;
        if (res.status === 404 && err === 'unknown machine' && mid !== 'local') {
          // The saved machine is gone from the config: forget it and show this Mac.
          try { localStorage.removeItem('ccab.machine'); } catch (_) {}
          next = 0;
          useMachine('local');
        } else if (res.status === 502 && err === 'unreachable' && mid !== 'local') {
          onMachineDown();
          next = S.fails > 6 ? 10000 : POLL_MS;
        } else {
          throw new Error('HTTP ' + res.status);
        }
      } else {
        const data = await res.json();
        if (gen !== S.gen) return;
        takeMachines(data);
        if (data && data.loading) {
          if (!S.snap) { S.mode = 'loading'; render(); }
          next = LOADING_MS;
        } else if (data && typeof data.now === 'number') {
          onSnapshot(data);
        } else {
          throw new Error('Unexpected payload');
        }
      }
    } catch (_) {
      if (gen !== S.gen) next = 0; // aborted by a machine switch, which already polls the new one
      else if (pausedAbort) next = doc.hidden || S.paused ? 0 : 50;
      else { onError(); next = S.fails > 6 ? 10000 : POLL_MS; }
    } finally {
      clearTimeout(killer);
      if (inflight === ctrl) inflight = null;
      if (next && gen === S.gen) schedule(next);
    }
  }

  /* ================= Events ================= */
  doc.addEventListener('click', e => {
    const t = e.target;
    // Session controls: confirm, sheets, actions, messages
    if (t.closest('#cfm-scrim')) { if (C.cfm) C.cfm(false); return; }
    const cfm = t.closest('[data-cfm]');
    if (cfm) { if (C.cfm) C.cfm(cfm.dataset.cfm === '1'); return; }
    if (t.closest('#sheet-scrim') || t.closest('[data-sheet-close]')) { closeSheet(); return; }
    const nw = t.closest('[data-new]');
    if (nw) { openNewTask(nw); return; }
    const act = t.closest('[data-act]');
    if (act) { if (act.getAttribute('aria-disabled') !== 'true') runAction(act.dataset.act, act); return; }
    const lr = t.closest('[data-logs-refresh]');
    if (lr) { if (lr.getAttribute('aria-disabled') !== 'true') loadLogs(); return; }
    if (t.closest('[data-nt-again]')) { renderNewForm(); const p = $('#nt-prompt'); if (p) p.focus(); return; }
    if (t.closest('[data-msg-all]') && C.msgs) {
      C.msgs.all = true; renderMessages();
      const l = $('#d-msg-list'); if (l) l.focus({ preventScroll: true });
      return;
    }
    const more = t.closest('[data-msg-more]');
    if (more && C.msgs) {
      const k = more.dataset.msgMore;
      if (C.msgs.open.has(k)) C.msgs.open.delete(k); else C.msgs.open.add(k);
      renderMessages();
      const b = $$('[data-msg-more]').find(x => x.dataset.msgMore === k); if (b) b.focus({ preventScroll: true });
      return;
    }
    if (t.closest('[data-msg-retry]') && C.msgs) { C.msgs.err = null; C.msgs.at = 0; renderMessages(); loadMessages(C.msgs); return; }
    if (t.closest('#mscrim')) { closeMenu(true); return; }
    const machine = t.closest('[data-machine]');
    if (machine) { pickMachine(machine.dataset.machine); return; }
    const mpick = t.closest('[data-mpick]');
    if (mpick) { openMenu(mpick.dataset.mpick); return; }
    const back = t.closest('[data-back]');
    if (back) { goBack(); return; }
    const retry = t.closest('[data-retry]');
    if (retry) { haptic(); S.fails = 0; poll(); return; }
    const metric = t.closest('[data-metric]');
    if (metric) {
      if (S.metric !== metric.dataset.metric) {
        S.metric = metric.dataset.metric;
        try { localStorage.setItem('ccab.metric', S.metric); } catch (_) {}
        haptic();
        if (S.snap) renderChart(S.snap);
      }
      return;
    }
    const tg = t.closest('.sub-toggle');
    if (tg) {
      if (tg.getAttribute('aria-disabled') === 'true') return;
      const card = tg.closest('.session');
      const open = !card.classList.contains('open');
      card.classList.toggle('open', open);
      tg.setAttribute('aria-expanded', String(open));
      if (open) S.expanded.add(card.dataset.key); else S.expanded.delete(card.dataset.key);
      haptic();
      return;
    }
    const bar = t.closest('.bar');
    if (bar && e.detail === 0) { selectIdx(+bar.dataset.i, true); return; } // keyboard activation
    const open = t.closest('[data-open]');
    if (open) openDetail(open.dataset.open);
  });

  // Chart: tap a bar, or drag across bars to scrub.
  let scrub = null;
  const chartCard = $('#chart');
  chartCard.addEventListener('pointerdown', e => {
    const bars = e.target.closest('.bars');
    if (!bars || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const i = idxAt(bars, e.clientX);
    const hours = S.snap ? chartHours(S.snap) : [];
    scrub = { id: e.pointerId, x: e.clientX, moved: false, bars, was: hours[i] && S.sel === hours[i].t };
    try { bars.setPointerCapture(e.pointerId); } catch (_) {}
    selectIdx(i, false);
  });
  chartCard.addEventListener('pointermove', e => {
    if (!scrub || e.pointerId !== scrub.id) return;
    if (Math.abs(e.clientX - scrub.x) > 6) scrub.moved = true;
    if (scrub.moved) selectIdx(idxAt(scrub.bars, e.clientX), false);
  });
  const endScrub = e => {
    if (!scrub || e.pointerId !== scrub.id) return;
    if (e.type === 'pointerup' && !scrub.moved && scrub.was) { S.sel = null; haptic(); applySel(); }
    scrub = null;
  };
  chartCard.addEventListener('pointerup', endScrub);
  chartCard.addEventListener('pointercancel', endScrub);
  chartCard.addEventListener('keydown', e => {
    const bar = e.target.closest('.bar');
    if (!bar) return;
    const n = bar.parentNode.children.length;
    let i = +bar.dataset.i;
    if (e.key === 'ArrowLeft') i = Math.max(0, i - 1);
    else if (e.key === 'ArrowRight') i = Math.min(n - 1, i + 1);
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = n - 1;
    else if (e.key === 'Escape' && S.sel != null) { S.sel = null; applySel(); e.stopPropagation(); return; }
    else return;
    e.preventDefault();
    selectIdx(i, false);
    const b = bar.parentNode.children[i]; if (b) b.focus();
  });

  // Machine picker: arrows move, Home/End jump, Tab and Escape close (Escape is handled below).
  $('#mmenu').addEventListener('keydown', e => {
    const items = $$('.mm-item', e.currentTarget);
    const i = items.indexOf(doc.activeElement);
    let j;
    if (e.key === 'ArrowDown') j = (i + 1) % items.length;
    else if (e.key === 'ArrowUp') j = (i - 1 + items.length) % items.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = items.length - 1;
    else if (e.key === 'Tab') { e.preventDefault(); closeMenu(true); return; }
    else return;
    e.preventDefault();
    if (items[j]) items[j].focus();
  });

  doc.addEventListener('keydown', e => {
    if (C.cfm) {
      if (e.key === 'Escape') { e.preventDefault(); C.cfm(false); } else if (e.key === 'Tab') trapTab(e, $('#cfm'));
      return;
    }
    // Cmd/Ctrl+Enter sends; plain Enter is a new line, as on a phone keyboard.
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && (e.target.id === 'd-send-text' || e.target.id === 'nt-prompt')) {
      e.preventDefault();
      if (e.target.id === 'd-send-text') submitSend(); else submitNew();
      return;
    }
    if (C.sheet) {
      if (e.key === 'Escape') { e.preventDefault(); closeSheet(); } else if (e.key === 'Tab') trapTab(e, $('#sheet'));
      return;
    }
    if (e.key === 'Escape' && S.menu) { e.preventDefault(); closeMenu(true); return; }
    const mpick = e.target.closest && e.target.closest('[data-mpick]');
    if (mpick && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      openMenu(mpick.dataset.mpick, e.key === 'ArrowDown' ? 'first' : 'last');
      return;
    }
    // Escape in a composer with text keeps the draft on screen instead of leaving the view.
    if (e.key === 'Escape' && S.view === 'detail' && !(e.target.id === 'd-send-text' && e.target.value)) goBack();
  });
  doc.addEventListener('submit', e => {
    if (e.target.id === 'd-send') { e.preventDefault(); submitSend(); }
    else if (e.target.id === 'nt-form') { e.preventDefault(); submitNew(); }
  });
  doc.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'd-send-text') { C.drafts.set(S.detailId, t.value); grow(t); syncSend(); }
    else if (t.id === 'nt-prompt' && t.getAttribute('aria-invalid') === 'true') { t.removeAttribute('aria-invalid'); setText($('#nt-prompt-err'), ''); }
  });
  doc.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'nt-proj') { C.newCwd = t.value; setText($('#nt-cwd'), t.value); }
    else if (t.name === 'nt-mode') { C.newMode = t.value; setHTML($('#nt-mode-hint'), modeHint(t.value)); }
  });
  window.addEventListener('resize', () => { if (S.menu) placeMenu(); });
  window.addEventListener('scroll', () => { if (S.menu) placeMenu(); }, { passive: true });

  doc.addEventListener('visibilitychange', () => {
    if (doc.hidden) {
      clearTimeout(timer);
      if (inflight) { pausedAbort = true; inflight.abort(); }
    } else {
      tick();
      poll();
    }
  });
  setInterval(() => { if (!doc.hidden) tick(); }, 1000);

  darkMQ.addEventListener && darkMQ.addEventListener('change', applyTheme);

  /* ================= Boot ================= */
  if (WA) {
    try { WA.ready(); } catch (_) {}
    try { WA.expand(); } catch (_) {}
    try { WA.onEvent('themeChanged', applyTheme); } catch (_) {}
    if (ver('6.1')) { try { WA.BackButton.onClick(onBack); WA.BackButton.hide(); } catch (_) {} }
    if (ver('8.0')) {
      try { WA.onEvent('activated', () => { S.paused = false; tick(); poll(); }); } catch (_) {}
      try { WA.onEvent('deactivated', () => { S.paused = true; clearTimeout(timer); }); } catch (_) {}
    }
  }
  applyTheme();
  render();
  poll();
})();
</script>
</body>
</html>
